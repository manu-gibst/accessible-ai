[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "accessible-ai"
version = "0.1.0"
description = "Reviewed image-to-answer responses with user-paced Windows typing"
requires-python = ">=3.11"
dependencies = ["Pillow>=11,<13", "websockets>=15,<17"]

[project.optional-dependencies]
test = ["httpx>=0.28,<1", "playwright>=1.50,<2"]

[project.scripts]
accessible-ai = "accessible_ai.__main__:main"

[tool.setuptools.package-data]
accessible_ai = ["web/*.html"]
